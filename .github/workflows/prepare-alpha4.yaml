name: Prepare reviewed alpha4 attached test
on:
  push:
    branches: [prepare/alpha4-attached-tests]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru
      - name: Original alpha2 baseline
        run: |
          set -euo pipefail
          test "$(calcit -v)" = 0.31.0-alpha.2
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
          calcit calcit.cirru edit format
          git diff --quiet -- calcit.cirru deps.cirru package.json yarn.lock
          bash reviewed-gates.sh
      - name: Guarded official source transaction and paired manifests
        run: node apply-reviewed.mjs apply
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru
      - name: Paired alpha4 original gates
        run: |
          set -euo pipefail
          test "$(calcit -v)" = 0.31.0-alpha.4
          caps --strict --ci
          yarn install
          yarn install --immutable
          caps verify --toolchain
          calcit calcit.cirru edit format
          bash reviewed-gates.sh
          node apply-reviewed.mjs verify
          git diff --quiet -- scripts .github/workflows/upload.yaml .yarnrc.yml
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: feather-alpha4-source
          path: acceptance
          if-no-files-found: error
          retention-days: 30
